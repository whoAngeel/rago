services:
  frontend:
    image: rago-frontend:latest
    ports:
      - target: 80
        published: 8080
    networks:
      - backend

  app:
    image: rago:latest
    env_file: .env
    environment:
      PORT: "4000"
      ENV: "production"
      HOST: "0.0.0.0"
    ports:
      - target: 4000
        published: 4000
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:17-alpine
    ports:
      - target: 5432
        published: 5433
    environment:
      POSTGRES_USER: rago
      POSTGRES_PASSWORD: rago
      POSTGRES_DB: rago
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rago"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  pg_data:

networks:
  backend:
    driver: bridge
