name: Deploy to Homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Build Go binary
        run: CGO_ENABLED=0 go build -o server ./cmd/server/

      - name: Build backend Docker image
        run: docker build -t rago:latest .

      - name: Build frontend Docker image
        run: docker build -t rago-frontend:latest ./frontend/

      - name: Deploy stack
        run: |
          mkdir -p /home/whoangel/rago
          cp docker-compose.yml /home/whoangel/rago/
          cd /home/whoangel/rago
          docker stack deploy -c docker-compose.yml rago --resolve-image=always
          docker image prune -f

      - name: Smoke test
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 15); do
            REPLICAS=$(docker stack services rago --format '{{.Replicas}}' | grep -v "0/1" | wc -l)
            TOTAL=$(docker stack services rago --format '{{.Replicas}}' | wc -l)
            if [ "$REPLICAS" = "$TOTAL" ]; then
              echo "All services ready!"
              break
            fi
            echo "  [$i/15] waiting for all replicas..."
            sleep 4
          done

          echo "Testing frontend via Caddy..."
          for i in $(seq 1 10); do
            curl -f -m 5 http://localhost:8080/ >/dev/null 2>&1 && { echo "OK: frontend responds"; break; }
            echo "  [$i/10] waiting..."
            sleep 3
            if [ "$i" = "10" ]; then
              echo "FAIL: frontend not responding"
              docker service logs rago_frontend --tail=30
              exit 1
            fi
          done

          echo "Testing API proxy through Caddy..."
          curl -f -m 5 http://localhost:8080/health && echo "OK: API proxy responds" || {
            echo "FAIL: API proxy not working"
            docker service logs rago_frontend --tail=30
            docker service logs rago_app --tail=30
            exit 1
          }
