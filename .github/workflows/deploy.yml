name: Deploy to Homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Build Go binary
        run: CGO_ENABLED=0 go build -o server ./cmd/server/

      - name: Build backend Docker image
        run: docker build -t rago:latest .

      - name: Build frontend Docker image
        run: docker build -t rago-frontend:latest ./frontend/

      - name: Deploy
        run: |
          mkdir -p /home/whoangel/rago
          cp docker-compose.yml /home/whoangel/rago/
          cd /home/whoangel/rago
          docker compose up -d --remove-orphans
          docker image prune -f

      - name: Smoke test
        run: |
          echo "Waiting for API proxy (backend) to be ready..."
          for i in $(seq 1 30); do
            curl -f -m 5 http://localhost:8080/health >/dev/null 2>&1 && { echo "OK: API proxy responds"; backend_ok=1; break; }
            echo "  [$i/30] waiting for backend..."
            sleep 4
          done

          if [ -z "$backend_ok" ]; then
            echo "FAIL: API proxy not responding"
            docker compose -f /home/whoangel/rago/docker-compose.yml logs --tail=50
            exit 1
          fi

          echo "Testing frontend serving..."
          curl -f -m 5 http://localhost:8080/ >/dev/null 2>&1 && echo "OK: frontend responds" || {
            echo "FAIL: frontend not working"
            docker compose -f /home/whoangel/rago/docker-compose.yml logs --tail=50
            exit 1
          }
