name: Deploy to Homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Build Go binary
        run: CGO_ENABLED=0 go build -o server ./cmd/server/

      - name: Build backend Docker image
        run: docker build -t rago:latest .

      - name: Build frontend Docker image
        run: docker build -t rago-frontend:latest ./frontend/

      - name: Sync compose and deploy
        run: |
          cp docker-compose.yml /home/whoangel/rago/
          cd /home/whoangel/rago
          docker compose up -d --remove-orphans
          docker image prune -f

      - name: Smoke test
        run: |
          echo "Waiting for frontend container..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Status}}' rago-frontend-1 2>/dev/null || echo "missing")
            if [ "$STATUS" = "running" ]; then
              echo "Frontend running!"
              break
            fi
            echo "  [$i/30] status=$STATUS, waiting..."
            sleep 2
          done

          echo "Testing frontend via Caddy..."
          curl -f -m 5 http://localhost:8080/ && echo "OK: frontend responds" || {
            echo "FAIL: frontend not responding"
            docker compose -f /home/whoangel/rago/docker-compose.yml logs --tail=30 frontend
            exit 1
          }

          echo "Testing API proxy through Caddy..."
          curl -f -m 5 http://localhost:8080/health && echo "OK: API proxy responds" || {
            echo "FAIL: API proxy not working"
            docker compose -f /home/whoangel/rago/docker-compose.yml logs --tail=30
            exit 1
          }
