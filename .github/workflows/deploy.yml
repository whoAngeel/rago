name: Deploy to Homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Build Go binary
        run: CGO_ENABLED=0 go build -o server ./cmd/server/

      - name: Build backend Docker image
        run: docker build -t rago:latest .

      - name: Build frontend Docker image
        run: docker build -t rago-frontend:latest ./frontend/

      - name: Deploy
        run: |
          mkdir -p /home/whoangel/rago
          cp docker-compose.yml /home/whoangel/rago/
          cd /home/whoangel/rago
          docker compose up -d --remove-orphans
          docker image prune -f

      - name: Smoke test
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 15); do
            curl -f -m 5 http://localhost:8080/ >/dev/null 2>&1 && { echo "OK: frontend responds"; break; }
            echo "  [$i/15] waiting..."
            sleep 4
            if [ "$i" = "15" ]; then
              echo "FAIL: frontend not responding"
              docker compose -f /home/whoangel/rago/docker-compose.yml logs --tail=30
              exit 1
            fi
          done

          echo "Testing API proxy through Caddy..."
          curl -f -m 5 http://localhost:8080/health && echo "OK: API proxy responds" || {
            echo "FAIL: API proxy not working"
            docker compose -f /home/whoangel/rago/docker-compose.yml logs --tail=30
            exit 1
          }
